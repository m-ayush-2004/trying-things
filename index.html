<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Letters Index</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Courier+Prime:wght@700&family=Inter:wght@400;600&display=swap"
            rel="stylesheet">
        <style>
        .font-script { font-family: 'Caveat', cursive; }
        .font-typewriter { font-family: 'Courier Prime', monospace; }
        
        /* Initial States for Entry Animations */
        .reveal-text {
            opacity: 0;
            transform: translateY(50px) rotate(10deg);
            transition: all 1s ease-out;
            transform-origin: bottom left;
        }
        
        .reveal-subtext {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 1s ease-out 0.3s;
        }

        .reveal-arrow {
            opacity: 0;
            transition: opacity 1s ease-out 0.7s;
        }

        .nav-item {
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Loaded State Classes */
        body.loaded .reveal-text {
            opacity: 1;
            transform: translateY(0) rotate(-3deg);
        }
        body.loaded .reveal-subtext {
            opacity: 1;
            transform: translateX(0);
        }
        body.loaded .reveal-arrow {
            opacity: 1;
        }

        /* Envelope Styles */
        .envelope-container {
            perspective: 1000px;
        }
        .envelope {
            position: absolute;
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Centering */
            top: 50%;
            left: 50%;
            margin-top: -104px; /* Half of height */
            margin-left: -160px; /* Half of width (approx for mobile), overridden by JS */
            transform-origin: center center;
        }
    </style>
    </head>
    <body
        class="bg-[#f7f5f0] text-[#cf2e2e] font-sans selection:bg-[#cf2e2e] selection:text-white overflow-hidden relative min-h-screen flex flex-col">

        <!-- Navigation -->
        <nav
            class="absolute top-0 w-full p-6 flex justify-between items-center z-50">
            <div class="flex space-x-2 items-center opacity-0 nav-item"
                style="animation-delay: 0.5s;">
                <!-- Lucide Heart Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="currentColor"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    class="w-5 h-5 fill-current"><path
                        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5 4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></svg>
                <span
                    class="font-typewriter font-bold tracking-widest text-sm uppercase">Postbox</span>
            </div>

        </nav>

        <!-- Main Content -->
        <main
            class="flex-grow flex flex-col md:flex-row items-center justify-center w-full px-4 md:px-20 relative z-10">

            <!-- Left Side: Envelope Stack -->
            <div id="stack-area"
                class="relative w-full md:w-1/2 h-[400px] flex items-center justify-center cursor-pointer group envelope-container">
                <!-- Envelopes will be injected here by JS -->

                <div
                    class="absolute bottom-10 text-gray-400 text-xs tracking-widest opacity-60 pointer-events-none font-typewriter z-0">
                    CLICK TO SHUFFLE
                </div>
            </div>

            <!-- Right Side: Text -->
<!-- Replace this section in your HTML -->

<div class="w-full md:w-1/2 flex flex-col justify-center items-center md:items-center text-center md:text-center z-40 mt-10 md:mt-0">
    <h1>
        <span class="block font-script text-7xl md:text-9xl reveal-text">
            Letters
        </span>
        <span class="block font-typewriter text-4xl md:text-6xl mt-4 md:-mt-4 ml-4 reveal-subtext">
            for you
        </span>
    </h1>

    <!-- Decorative Arrow -->
    <div class="mt-12 reveal-arrow pointer-events-none">
        <svg width="100" height="80" viewBox="0 0 100 80"
            class="stroke-current fill-none stroke-2 text-[#cf2e2e]">
            <path d="M10,10 Q50,5 60,40 T90,60"
                stroke-dasharray="5,5" />
            <path d="M80,50 L90,62 L80,75" />
        </svg>
    </div>

    <!-- Click Me Button - Now Clickable -->
    <a href="page2.html"
        class="font-typewriter text-xl md:text-xl mt-4 md:-mt-4 ml-60 hover:text-[#cf2e2e] transition-colors cursor-pointer">
        <pre>                          </pre> click me
    </a>
</div>


        </main>

        <!-- Background Decoration -->
        <div
            class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-orange-100 via-transparent to-transparent z-0"></div>

        <script>
        // --- State ---
        const state = {
            activeLetter: 0,
            isLoaded: false,
            hovered: false
        };

        // --- Configuration ---
        const envelopeColor = "#e62e38";
        const sealColor = "#d4af37";
        const baseRotations = [-5, 12, -8];
        const stackArea = document.getElementById('stack-area');
        
        // --- SVG Template for Envelope ---
        const envelopeSVG = `
            <svg viewBox="0 0 300 200" class="w-full h-full drop-shadow-xl overflow-visible">
                <defs>
                    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
                    </filter>
                </defs>
                <rect x="0" y="0" width="300" height="200" fill="${envelopeColor}" rx="4" />
                <path d="M0,200 L150,110 L300,200" fill="rgba(0,0,0,0.1)" />
                <path d="M0,200 L150,115 L300,200" fill="${envelopeColor}" />
                <path d="M0,0 L110,100 L0,200" fill="rgba(0,0,0,0.05)" />
                <path d="M300,0 L190,100 L300,200" fill="rgba(0,0,0,0.05)" />
                <g class="origin-top transition-transform duration-500">
                    <path d="M0,0 L150,120 L300,0" fill="${envelopeColor}" filter="brightness(0.9)" />
                    <circle cx="150" cy="120" r="18" fill="${sealColor}" filter="url(#paper-shadow)" />
                    <circle cx="150" cy="120" r="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
                    <path d="M145,115 L155,125 M155,115 L145,125" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
                </g>
            </svg>
        `;

        // --- Initialization ---
        const envelopeElements = [];

        function createEnvelopes() {
            for (let i = 0; i < 3; i++) {
                const el = document.createElement('div');
                // Basic classes for size and absolute positioning
                el.className = 'envelope w-80 h-52 md:w-96 md:h-64';
                el.innerHTML = envelopeSVG;
                stackArea.appendChild(el);
                envelopeElements.push(el);
            }
        }

        // --- Render Loop ---
        function updateStack() {
            envelopeElements.forEach((el, index) => {
                // Calculate position relative to the active letter
                // 0 = Top, 1 = Middle, 2 = Bottom
                let position = (index - state.activeLetter + 3) % 3;

                // Visual calculations
                const zIndex = 30 - (position * 10);
                const scale = 1 - (position * 0.05);
                const brightness = 1 - (position * 0.05);
                
                // Rotation logic
                const currentRotation = state.isLoaded ? baseRotations[index] : 0;
                
                // Hover offsets
                const hoverOffsetY = state.hovered ? (position * 40) - 20 : 0;
                const hoverOffsetX = state.hovered ? (hoverOffsetY * 0.5) : 0;
                const hoverRotate = state.hovered ? (position * 5) - 5 : 0;

                // Entry animation Y-offset
                const entryY = state.isLoaded ? 0 : 100; // Start 100px down

                // Apply styles
                el.style.zIndex = zIndex;
                el.style.opacity = state.isLoaded ? 1 : 0;
                el.style.filter = `brightness(${brightness})`;
                
                // Transform composition
                // Note: We use margin-left/top for centering in CSS, 
                // so we just translate relative to that center point.
                el.style.transform = `
                    translateY(${entryY + hoverOffsetY}px) 
                    translateX(${hoverOffsetX}px) 
                    rotate(${currentRotation + hoverRotate}deg) 
                    scale(${scale})
                `;
            });
        }

        // --- Event Listeners ---
        
        // 1. Hover Logic
        stackArea.addEventListener('mouseenter', () => {
            state.hovered = true;
            updateStack();
        });

        stackArea.addEventListener('mouseleave', () => {
            state.hovered = false;
            updateStack();
        });

        // 2. Click Logic (Shuffle)
        stackArea.addEventListener('click', () => {
            state.activeLetter = (state.activeLetter + 1) % 3;
            updateStack();
        });

        // 3. Init on Load
        window.addEventListener('load', () => {
            createEnvelopes();
            
            // Initial render (invisible)
            updateStack();

            // Trigger Entry Animation after short delay
            setTimeout(() => {
                state.isLoaded = true;
                document.body.classList.add('loaded');
                updateStack();
            }, 100);
        });

    </script>
    </body>

</html>
